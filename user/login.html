<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="login-body">
    <div class="flash-message" id="flash-message"></div>
    <div class="login-overlay"></div>
    <div class="login-container">
        <h2><i class="fas fa-sign-in-alt"></i>Connexion</h2>
        <form method="POST" action="/login">
            <input type="text" name="identifier" placeholder="email or username" required>
            <input type="password" name="password" placeholder="password" required>
            <button type="submit">Se connecter</button>
        </form>
        <label><input type="checkbox" name="remember"> Remember me</label>
        <p class="forgot-password"><a href="/forgot-password">Mot de passe oublié ?</a></p>
        <p class="register-link">Pas encore de compte ? <a href="/register">Créer un compte</a></p>
        <a href="/" class="login-back">Back</a>
    </div>
    <script>
        fetch('/flash')
        .then(res => res.json())
        .then(data => {
            if (data.message) {
                const msg = document.getElementById('flash-message');
                msg.textContent = data.message;
                msg.style.color = 'red';
            }
        });
    </script>
</body>

</html>
