<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Inscription</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="register-body">
    <div class="flash-message" id="flash-message"></div>
    <div class="register-overlay"></div>
    <div class="register-container">
        <h2><i class="fas fa-sign-in-alt"></i>Inscription</h2>
        <form method="POST" action="/register">
            <input type="text" name="username" placeholder="username" required>
            <input type="email" name="email" placeholder="email" required>
            <input type="password" name="password" placeholder="password" required>
            <button type="submit">Register</button>
        </form>
        <p id="passwordError" style="color:red;display:none;">
            Le mot de passe doit contenir au moins :
            <br>- 8 caractères
        </p>
        <label><input type="checkbox" name="remember"> Remember me</label>
        <p class="register-link">Déjà inscrit ? <a href="/login">Connecte-toi</a></p>
        <a href="/" class="register-back">Back</a>
    </div>
    <script>
        fetch('/flash')
        .then(res => res.json())
        .then(data => {
            if (data.message) {
                const msg = document.getElementById('flash-message');
                msg.textContent = data.message;
                msg.style.color = 'red';
            }
        });
        
        function isValidEmailRegEx(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        function isPasswordLongEnough(password) {
            return password.length >= 8;
        }

        function validateRegisterForm() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');

            let valid = true;

            if (!isValidEmailRegEx(email)) {
                emailError.style.display = 'block';
                valid = false;
            } else
                emailError.style.display = 'none';
            if (!isPasswordLongEnough(password)) {
                passwordError.style.display = 'block';
                valid = false;
            } else
                passwordError.style.display = 'none';
            return valid;
        }
    </script>
</body>

</html>
